[package]
name = "osm-gimmisn"
version = "26.8.0"
edition = "2024"
license = "MIT"

[dependencies]
accept-language = "3.1.0"
anyhow = "1.0.104"
clap = "4.6.6"
csv = "1.4.0"
derivative = "2.2.0"
gettext = "0.4.0"
git-version = "0.3.9"
html-escape = "0.2.15"
html_parser = "0.7.0"
isahc = "2.0.1"
lazy_static = "1.5.0"
log = "0.4.34"
once_cell = "1.21.4"
regex = "1.13.1"
rouille = "3.6.2"
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_icu_ucol = { version = "5.8.0", optional = true }
rust_icu_unumberformatter = { version = "5.8.0", optional = true }
rust_icu_ustring = { version = "5.8.0", optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
simplelog = "0.12.2"
time = { version = "0.3.55", features = ["formatting", "macros", "local-offset", "serde-well-known"] }
toml = "1.1.4"
unidecode = "0.3.0"
url = "2.5.8"

[dev-dependencies]
flate2 = "1.1.10"
sxd-document = "0.3.2"
sxd-xpath = "0.4.2"

[features]
icu = ["rust_icu_ucol", "rust_icu_ustring", "rust_icu_unumberformatter"]
default = ["icu"]

[profile.symbols]
inherits = "release"
debug = true
